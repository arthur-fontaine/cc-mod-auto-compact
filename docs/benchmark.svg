<text x="82" y="299.9" class="goal" style="font-size: 11px">≥ 80.4%: beats always keeping, p &lt; 0.05</text>
<text x="82" y="313.9" class="goal" style="font-size: 11px">&lt; 400 ms: the Doherty threshold</text>
